<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACADEMIA — TREINO DOS AMIGOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN/CADASTRO -->
  <div id="tela-auth" class="tela-auth">
    <div class="card">
      <h1 class="logo">ACADEMIA</h1>
      <p class="subtitulo">TREINO DOS AMIGOS</p>

      <div class="abas">
        <button id="aba-login" class="aba ativa">ENTRAR</button>
        <button id="aba-cadastro" class="aba">CADASTRAR</button>
      </div>

      <form id="form">
        <input type="text" id="nome" placeholder="SEU NOME">
        <input type="email" id="email" placeholder="SEU EMAIL" required>
        <input type="password" id="senha" placeholder="SUA SENHA" required minlength="6">
        <button type="submit" id="btn-acao">ENTRAR</button>
      </form>

      <p id="msg" class="msg"></p>
    </div>
  </div>

  <!-- TELA DO APP -->
  <div id="tela-app" class="tela-app escondido">

    <header class="app-header">
      <div class="header-conteudo">
        <div class="header-esquerda">
          <button id="btn-seta" class="btn-seta escondido" title="Desfazer">↩</button>
          <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        </div>

        <nav class="header-menu">
          <button id="menu-treino" class="menu-item ativo">TREINO</button>
          <button id="menu-peso" class="menu-item">MEU PESO</button>
          <button id="menu-exercicios" class="menu-item">EXERCÍCIOS</button>
          <button id="menu-semana" class="menu-item">SEMANA COMPLETA</button>
        </nav>

        <button id="btn-sair" class="btn-sair-topo">SAIR</button>
        <button id="btn-hamburguer" class="btn-hamburguer">☰</button>
      </div>

      <nav id="menu-mobile" class="menu-mobile escondido">
        <button id="menu-treino-mob" class="menu-item-mob">TREINO</button>
        <button id="menu-peso-mob" class="menu-item-mob">MEU PESO</button>
        <button id="menu-exercicios-mob" class="menu-item-mob">EXERCÍCIOS</button>
        <button id="menu-semana-mob" class="menu-item-mob">SEMANA COMPLETA</button>
        <button id="btn-sair-mob" class="menu-item-mob sair">SAIR</button>
      </nav>
    </header>

    <main class="conteudo">

      <!-- ABA: TREINO -->
      <section id="aba-treino" class="aba-conteudo">
        <h1 class="saudacao">OLÁ, <span id="nome-user"></span>!</h1>
        <p class="dia-hoje">HOJE É <strong id="dia-semana"></strong></p>

        <p id="resumo-ontem" class="resumo-ontem"></p>

        <div id="pergunta-ontem" class="pergunta-ontem escondido">
          <p>VOCÊ TREINOU ONTEM?</p>
          <div class="botoes-ontem">
            <button id="btn-treinei" class="btn-sim">✔ SIM, TREINEI</button>
            <button id="btn-faltei" class="btn-nao">✘ NÃO, FALTEI</button>
          </div>
        </div>

        <div class="treino-box">
          <span class="treino-label">TREINO DE HOJE</span>
          <p id="treino-hoje" class="treino-texto"></p>
        </div>
      </section>

      <!-- ABA: EXERCÍCIOS -->
      <section id="aba-exercicios" class="aba-conteudo escondido">
        <h2 class="titulo-secao">EXERCÍCIOS</h2>

        <p class="subtitulo-secao">SELECIONE O MÚSCULO</p>
        <div id="filtros-musculo" class="filtros-musculo"></div>

        <div id="exercicios-loading" class="exercicios-loading escondido">
          <p>CARREGANDO EXERCÍCIOS...</p>
        </div>

        <ul id="lista-exercicios" class="lista-exercicios"></ul>

        <p id="sem-exercicios" class="sem-dados escondido">
          NENHUM EXERCÍCIO ENCONTRADO. TENTE OUTRO MÚSCULO.
        </p>
      </section>

      <!-- ABA: HISTÓRICO -->
      <section id="aba-historico" class="aba-conteudo escondido">
        <h2 class="titulo-secao">HISTÓRICO DE PESO</h2>
        <ul id="lista-historico" class="lista-semana"></ul>
        <p id="sem-historico" class="sem-dados escondido">NENHUM REGISTRO AINDA.</p>
      </section>

      <!-- ABA: SEMANA -->
      <section id="aba-semana" class="aba-conteudo escondido">
        <h2 class="titulo-secao">SEMANA COMPLETA</h2>
        <ul id="lista-semana" class="lista-semana"></ul>
      </section>

    </main>
  </div>

  <!-- MODAL: MEU PESO -->
  <div id="modal-peso" class="modal-overlay escondido">
    <div class="modal-card" id="modal-peso-card">
      <button id="btn-fechar-modal" class="modal-x" title="Ver histórico">✕</button>
      <h2 class="modal-titulo">COLOQUE SEU PESO</h2>
      <div class="peso-input-box">
        <input type="number" id="input-peso" placeholder="EX: 78.5" step="0.1" min="0" max="500">
        <button id="btn-salvar-peso">SALVAR</button>
      </div>
      <p id="msg-peso" class="msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
